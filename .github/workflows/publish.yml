# nyquist-mcp と create-nyquist を npm に公開する。
# npm の Trusted Publishing（OIDC）で認証するので、npm のトークンを GitHub に置かない。
# リポジトリが公開されていれば、どのコミットからビルドしたかを示す provenance も付ける。
name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 公開するパッケージ
        type: choice
        options:
          - nyquist-mcp
          - create-nyquist

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # main 以外のブランチから、確かめていないコードを公開させない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # npm の Trusted Publishing の設定で、この environment 名を指定する。
    environment: npm
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing には npm 11.5.1 以上が要る。公開に使う CLI なので版を固定する。
      - run: npm install -g npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck build --filter="$PACKAGE"
      # workspace の参照を版に置き換えた tarball を作り、それを npm で公開する。
      - run: pnpm --filter "$PACKAGE" pack --pack-destination "$RUNNER_TEMP/package"
      # リポジトリの package.json は devEngines で pnpm を指定しているので、npm はリポジトリの外で動かす。
      - name: npm publish
        working-directory: ${{ runner.temp }}/package
        env:
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: npm publish ./*.tgz --access public --provenance="$PROVENANCE"
